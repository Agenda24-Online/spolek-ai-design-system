name: Deploy original HTML SAOS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare complete static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'docs/' \
            --exclude 'README.md' \
            ./ _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/ai-team/root-knowledge-core/index.html
          test -f _site/ai-team/root-knowledge-core/model.js
          test -f _site/ai-team/wave-reach-connector/index.html
          test -f _site/ai-team/orbit-insight-finder/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
