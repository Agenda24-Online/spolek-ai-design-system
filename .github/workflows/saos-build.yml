name: SAOS build

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/saos-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate and build
        run: npm run build
